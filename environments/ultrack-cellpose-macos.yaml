name: ultrack-cell-tracking-local

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - numpy=2.0.2
  # Install PyTorch through conda so it shares conda's OpenMP runtime.
  - pytorch=2.14.1
  - pyqt6=6.11.0
  - pip:
      - cellpose==3.1.1.3
      - gurobipy==13.0.3
      - napari==0.10.0
      - ultrack==0.8.0

variables:
  QT_API: pyqt6
